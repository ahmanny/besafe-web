<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F19" />
      <stop offset="50%" stop-color="#141B2D" />
      <stop offset="100%" stop-color="#070B14" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4E59D4" />
      <stop offset="50%" stop-color="#353FAB" />
      <stop offset="100%" stop-color="#242B80" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />

  <!-- Outer Neon Shield Glow -->
  <path
    d="M256 64 L416 128 C416 272 348 392 256 448 C164 392 96 272 96 128 Z"
    fill="none"
    stroke="url(#glowGrad)"
    stroke-width="12"
    stroke-linejoin="round"
    filter="url(#glow)"
    opacity="0.4"
  />

  <!-- Main Shield Body -->
  <path
    d="M256 80 L396 136 C396 262 336 368 256 420 C176 368 116 262 116 136 Z"
    fill="url(#shieldGrad)"
    stroke="#8B93FF"
    stroke-width="6"
    stroke-linejoin="round"
  />

  <!-- Inner High-tech Grid Lines -->
  <path
    d="M256 120 L256 380"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.3"
  />
  <path
    d="M176 210 L336 210"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.2"
  />

  <!-- Central Pulse Distress Core -->
  <circle cx="256" cy="240" r="48" fill="#EF4444" opacity="0.2" />
  <circle cx="256" cy="240" r="32" fill="#EF4444" opacity="0.5" />
  <circle cx="256" cy="240" r="18" fill="#FFFFFF" />

  <!-- Radio Beacon Rings -->
  <path
    d="M200 240 A56 56 0 0 1 312 240"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="4"
    stroke-linecap="round"
    opacity="0.8"
  />
  <path
    d="M170 240 A86 86 0 0 1 342 240"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.5"
  />
  <path
    d="M140 240 A116 116 0 0 1 372 240"
    fill="none"
    stroke="#FFFFFF"
    stroke-width="2"
    stroke-linecap="round"
    opacity="0.3"
  />
</svg>
